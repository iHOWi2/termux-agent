name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure signing key
        run: |
          if [ ! -f keystore/release.p12 ]; then
            mkdir -p keystore
            keytool -genkeypair -v -storetype PKCS12 -keystore keystore/release.p12 \
              -alias termuxagent -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass termuxagent -keypass termuxagent \
              -dname "CN=Termux Agent, O=iHOWi2"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/release.p12
            git commit -m "ci: add signing key [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TermuxAgent-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TermuxAgent-apk
          path: TermuxAgent-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Termux Agent build ${{ github.run_number }}
          body: Automatic build from ${{ github.sha }}
          files: TermuxAgent-*.apk
          make_latest: true
